<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form onsubmit="validar(event)">
            <h2 class="cabecalho">Esqueci a Senha</h2>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Digite seu email" required>

            <label for="senha">Nova Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>

            <label for="NovaSenha">Confirmar nova Senha</label>
            <input type="password" id="NovaSenha" placeholder="Confirme sua senha" required>

            <button type="submit" id="botao">Validar</button>
            <a class="botao" href="index.html">Voltar para login</a>
            <p id="resultado"></p>
        </form>
    </div>
    <script>
        
        let senha = document.getElementById("senha");
        let NovaSenha = document.getElementById("NovaSenha");
        let resultado = document.getElementById("resultado");
        let botao = document.getElementById("botao");

        function validar(event){
            if(senha.value == NovaSenha.value){
                resultado.innerText = "Senha atualizada com sucesso, volte à tela principal.";
            }
            else{
                resultado.innerText = "As senhas são diferentes.";
            }
            event.preventDefault();
        };

    </script>
</body>
</html>
