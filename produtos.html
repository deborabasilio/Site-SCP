<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <form>
        <h2 class="cabecalho">Cadastro de Produtos</h2>
            <label for="codigo">Código do produto</label>
            <input type="text" id="codigo" placeholder="Digite o código" required>

            <label for="descSimples">Descrição simples</label>
            <input type="text" id="descSimples" placeholder="Digite uma descrição simples" required>

            <label for="descCompleta">Descrição completa</label>
            <textarea id="descCompleta" placeholder="Digite uma descrição completa" required></textarea>

            <label for="valor">Valor de venda</label>
            <input type="text" id="valor" placeholder="Digite o valor de venda" required>

            <label for="Categoria">Categoria do produto</label>
            <select id="Categoria" required>
                <option value="" disabled selected>Selecione uma categoria</option>
                <option value="eletronicos">Eletrônicos</option>
                <option value="informatica">Informática</option>
                <option value="ferramentas">Ferramentas</option>
            </select>

            <button onclick="gravar()" id="botao">Gravar</button>

            <a href="menu.html">
                <button type="button">Voltar</button>
            </a>

            <p id="mensagem"></p>
        </form>
    </div>
    
    <script>
        let mensagem = document.getElementById("mensagem");

        function gravar(){
            event.preventDefault();
            mensagem.innerText = "Produto gravado com sucesso.";
        }
    </script>

</body>

</html>
